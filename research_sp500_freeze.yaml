  learning_rate: 0.0005
  training_steps: 8000
  validation_interval: 250
  early_stopping_patience: 8
  sampling_steps: 30
  ensemble_paths: 20
  split_output_heads: true
  mean_loss_weight: 1.0
  volatility_loss_weight: 2.0
  validation_seeds: [42, 314, 2718]
  path_validation_paths: 8
  path_validation_steps: 10
  residual_scale_grid: [1.0]

