data:
  source: yfinance
  universe: sp500
  universe_manifest: ./research_data/universes/sp500_202312.csv
  universe_snapshot_date: '2023-12'
  start_date: '20150101'
  end_date: '20240101'
  eligibility_end_date: '20221230'
  preprocess_fit_end_date: '20221230'
  min_history: 756
  min_coverage: 0.95
  winsorize_std: 5.0
data_dir: ./research_data/sp500
